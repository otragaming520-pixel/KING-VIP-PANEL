<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>KING TRADING VIP PREDICTOR</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<!-- FontAwesome Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
:root {
    --gold-main: #ffee00;
    --gold-glow: #ffaa00;
    --neon-green: #39ff14;
    --dark-bg: #0f1208;
}

* { margin:0; padding:0; box-sizing:border-box; font-family:'Orbitron', sans-serif; user-select: none; }
body { background:#000; overflow:hidden; width: 100vw; height: 100vh; }

#bg-frame { position: fixed; inset: 0; width: 100%; height: 100%; border: none; z-index: 1; }

/* MINI FLOATING BUTTON */
#mini {
    position: fixed; right: 20px; bottom: 100px; width: 60px; height: 60px;
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
    cursor: pointer; z-index: 9999; background: radial-gradient(circle,#2a3300,#0a0f00);
    border: 2px solid var(--gold-main); box-shadow: 0 0 15px var(--gold-main);
}
#mini img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }

/* MAIN PANEL WRAPPER */
#panel-wrapper {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 250px; display: none; justify-content: center; align-items: center;
    z-index: 10000;
}

/* BUTTERFLY WINGS CONTAINER */
.wings-bg {
    position: absolute; width: 440px; height: 260px;
    pointer-events: none; z-index: 1; display: flex; justify-content: space-between;
}

/* WINGS SPREADING OUTWARDS */
.wing {
    width: 130px; height: 100%;
    filter: drop-shadow(0 0 12px rgba(255, 230, 0, 0.9)) drop-shadow(0 0 25px rgba(255, 120, 0, 0.7));
    animation: wingPulse 2.5s ease-in-out infinite alternate;
}

.wing-left { transform-origin: right center; }
.wing-right { transform-origin: left center; }

@keyframes wingPulse {
    0% { transform: scale(0.98) rotate(0deg); }
    100% { transform: scale(1.04) rotate(2deg); }
}

/* MAIN PANEL UI */
#main {
    position: relative; z-index: 2; width: 230px;
    background: radial-gradient(circle at center, #1a220d 0%, #080c03 100%);
    border: 2px solid #a8ff00; border-radius: 20px;
    box-shadow: 0 0 15px #88ff00, inset 0 0 15px rgba(168, 255, 0, 0.3);
    padding: 12px; text-align: center; overflow: hidden;
}

.header {
    display: flex; justify-content: space-between; align-items: center;
    padding-bottom: 8px; border-bottom: 1px solid rgba(168, 255, 0, 0.3);
    cursor: move;
}

.header-title {
    display: flex; align-items: center; gap: 6px;
    font-size: 11px; font-weight: 900; color: #fff; text-shadow: 0 0 8px var(--gold-main);
}

.bolt-icon {
    width: 18px; height: 18px; background: #ffd700; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; color: #000;
    font-size: 11px; font-weight: bold; box-shadow: 0 0 8px #ffd700;
}

.close-btn {
    width: 18px; height: 18px; border-radius: 50%; border: 1px solid #ff4444;
    color: #ff4444; font-size: 10px; display: flex; align-items: center;
    justify-content: center; cursor: pointer; font-weight: bold;
}

.status-title {
    font-size: 9px; color: var(--gold-main); letter-spacing: 1px;
    margin: 8px 0 6px 0; font-weight: 700; text-shadow: 0 0 5px var(--gold-main);
}

.info-box {
    background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(255, 230, 0, 0.4);
    border-radius: 8px; padding: 6px 8px; margin-bottom: 6px;
    font-family: 'Rajdhani', sans-serif; font-size: 11px; font-weight: 700;
    color: #fff; text-align: left;
}

.btn-action {
    width: 100%; padding: 10px; border: none; border-radius: 20px;
    background: linear-gradient(180deg, #ffdd00 0%, #76e600 100%);
    color: #000; font-size: 11px; font-weight: 900; cursor: pointer;
    box-shadow: 0 0 12px #76e600; margin-top: 8px; text-transform: uppercase;
    transition: 0.2s;
}
.btn-action:active { transform: scale(0.96); }

.engine-footer {
    font-size: 8px; color: var(--gold-main); margin-top: 6px;
    letter-spacing: 1.5px; font-weight: 700;
}

/* PREDICTION RESULT STYLES */
.res-text {
    font-size: 20px; font-weight: 900; color: #fff;
    text-shadow: 0 0 10px var(--gold-main); margin: 6px 0; display: block;
}
.confidence-tag {
    display: inline-block; border: 1px solid var(--gold-main);
    border-radius: 10px; padding: 2px 8px; font-size: 9px;
    color: var(--gold-main); margin-bottom: 4px;
}
</style>
</head>
<body>

<iframe id="bg-frame" src="https://9kgame.teacherslex.site/WinGo/WinGo_1M"></iframe>

<!-- MINI ICON -->
<div id="mini" onclick="openM()">
    <img src="https://i.postimg.cc/3xB9f7wM/1000013396.jpg" alt="Icon">
</div>

<!-- MAIN FLOATING WRAPPER -->
<div id="panel-wrapper">
    
    <!-- SVG BUTTERFLY WINGS -->
    <div class="wings-bg">
        <!-- LEFT WING -->
        <svg class="wing wing-left" viewBox="0 0 150 250">
            <defs>
                <linearGradient id="wingGradL" x1="100%" y1="50%" x2="0%" y2="50%">
                    <stop offset="0%" stop-color="#ffea00"/>
                    <stop offset="50%" stop-color="#ff8800"/>
                    <stop offset="100%" stop-color="#88ff00"/>
                </linearGradient>
            </defs>
            <path d="M 145,120 C 120,90 70,20 10,10 C 0,30 20,70 50,95 C 15,110 0,135 15,160 C 35,185 80,180 100,165 C 60,190 30,220 55,240 C 85,250 125,180 145,130 Z" 
                  fill="url(#wingGradL)" stroke="#ffffff" stroke-width="1.5" opacity="0.95"/>
            <path d="M 145,125 Q 90,80 15,15 M 145,125 Q 70,100 50,95 M 145,125 Q 70,140 20,160 M 145,125 Q 90,170 55,235" 
                  stroke="rgba(255,255,255,0.7)" stroke-width="1.2" fill="none"/>
        </svg>

        <!-- RIGHT WING -->
        <svg class="wing wing-right" viewBox="0 0 150 250">
            <defs>
                <linearGradient id="wingGradR" x1="0%" y1="50%" x2="100%" y2="50%">
                    <stop offset="0%" stop-color="#ffea00"/>
                    <stop offset="50%" stop-color="#ff8800"/>
                    <stop offset="100%" stop-color="#88ff00"/>
                </linearGradient>
            </defs>
            <path d="M 5,120 C 30,90 80,20 140,10 C 150,30 130,70 100,95 C 135,110 150,135 135,160 C 115,185 70,180 50,165 C 90,190 120,220 95,240 C 65,250 25,180 5,130 Z" 
                  fill="url(#wingGradR)" stroke="#ffffff" stroke-width="1.5" opacity="0.95"/>
            <path d="M 5,125 Q 60,80 135,15 M 5,125 Q 80,100 100,95 M 5,125 Q 80,140 130,160 M 5,125 Q 60,170 95,235" 
                  stroke="rgba(255,255,255,0.7)" stroke-width="1.2" fill="none"/>
        </svg>
    </div>

    <!-- MAIN PANEL BODY -->
    <div id="main">
        <div class="header" id="dragHandle">
            <div class="header-title">
                <div class="bolt-icon">⚡</div>
                <span contenteditable="true">KING TRADING</span>
            </div>
            <div class="close-btn" onclick="closeM()">✕</div>
        </div>

        <!-- AUTH VIEW -->
        <div id="login-view">
            <div class="status-title" contenteditable="true">SERVER ACTIVATED</div>
            <div class="info-box" contenteditable="true">1. WinGo 1M Connected</div>
            <div class="info-box" contenteditable="true">2. Secure API Ready</div>
            <div class="info-box" contenteditable="true">3. Balance Synced</div>
            <button class="btn-action" onclick="showPredictor()">START ENGINE</button>
        </div>

        <!-- PREDICTION UI VIEW -->
        <div id="prediction-ui" style="display: none;">
            <div class="status-title" contenteditable="true">FINAL TRADE</div>
            <div style="background: rgba(0,0,0,0.5); border-radius: 10px; padding: 8px 6px; border: 1px solid rgba(255,230,0,0.3);">
                <!-- यहाँ पिछले ट्रेड का वास्तविक रिज़ल्ट सीधे शो होगा -->
                <span class="res-text" id="resultDisplay" contenteditable="true">READY</span>
                <div class="confidence-tag" id="confDisplay" contenteditable="true">CONF (98.5%)</div>
                <p id="periodDisplay" style="color:#fff; font-size:10px; font-weight: bold; font-family:'Rajdhani';" contenteditable="true">PERIOD: Fetching...</p>
            </div>
            <button class="btn-action" onclick="fetchLiveResultAndPredict()">GET RESULT</button>
        </div>

        <div class="engine-footer" contenteditable="true">⚡ KING ENGINE ⚡</div>
    </div>

</div>

<script>
const API_URL = "https://draw.ar-lottery01.com/WinGo/WinGo_1M/GetHistoryIssuePage.json?ts=";

function openM() {
    document.getElementById('panel-wrapper').style.display = 'flex';
    document.getElementById('mini').style.display = 'none';
}
function closeM() {
    document.getElementById('panel-wrapper').style.display = 'none';
    document.getElementById('mini').style.display = 'flex';
}

function showPredictor() {
    document.getElementById('login-view').style.display = 'none';
    document.getElementById('prediction-ui').style.display = 'block';
    fetchLiveResultAndPredict();
}

function updatePeriod() {
    const now = new Date();
    const year = now.getUTCFullYear();
    const month = String(now.getUTCMonth() + 1).padStart(2, '0');
    const day = String(now.getUTCDate()).padStart(2, '0');
    const totalMinutes = now.getUTCHours() * 60 + now.getUTCMinutes();
    const sequence = String(10001 + totalMinutes);
    const periodId = `${year}${month}${day}${sequence}`;
    document.getElementById('periodDisplay').innerText = "PERIOD: " + periodId;
    return periodId;
}

// API से लाइव रिजल्ट फैच करके पैनल में शो कराने का सिस्टम
async function fetchLiveResultAndPredict() {
    const res = document.getElementById('resultDisplay');
    const conf = document.getElementById('confDisplay');
    updatePeriod();
    
    res.style.opacity = "0.5";
    res.innerText = "FETCHING...";

    try {
        const response = await fetch(API_URL + Date.now());
        const data = await response.json();
        
        if (data && data.data && data.data.list && data.data.list.length > 0) {
            const latestDraw = data.data.list[0];
            const num = parseInt(latestDraw.number, 10);
            const size = num >= 5 ? "BIG" : "SMALL";
            
            let randomConf = (94 + Math.random() * 5.5).toFixed(1);

            setTimeout(() => {
                res.style.opacity = "1";
                res.innerText = `${size} ${num}`;
                conf.innerText = `CONF (${randomConf}%)`;
            }, 600);
        } else {
            fallbackRandomPrediction(res, conf);
        }
    } catch (e) {
        fallbackRandomPrediction(res, conf);
    }
}

function fallbackRandomPrediction(resEl, confEl) {
    const num = Math.floor(Math.random() * 10);
    const size = num >= 5 ? "BIG" : "SMALL";
    resEl.style.opacity = "1";
    resEl.innerText = `${size} ${num}`;
    confEl.innerText = "CONF (95.2%)";
}

// SMOOTH DRAGGING LOGIC FOR FLOATING PANEL
const wrapper = document.getElementById("panel-wrapper");
const dragHandle = document.getElementById("dragHandle");
let isDragging = false, offset = { x: 0, y: 0 };

const dragStart = (e) => {
    if(e.target.hasAttribute('contenteditable')) return;
    isDragging = true;
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    
    const rect = wrapper.getBoundingClientRect();
    offset.x = clientX - rect.left;
    offset.y = clientY - rect.top;
};

const dragMove = (e) => {
    if (!isDragging) return;
    e.preventDefault();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    
    let newX = clientX - offset.x;
    let newY = clientY - offset.y;
    
    wrapper.style.left = newX + (wrapper.offsetWidth / 2) + "px";
    wrapper.style.top = newY + (wrapper.offsetHeight / 2) + "px";
};

dragHandle.addEventListener("mousedown", dragStart);
dragHandle.addEventListener("touchstart", dragStart, {passive: false});
document.addEventListener("mousemove", dragMove);
document.addEventListener("touchmove", dragMove, {passive: false});
document.addEventListener("mouseup", () => isDragging = false);
document.addEventListener("touchend", () => isDragging = false);
</script>

</body>
</html>
